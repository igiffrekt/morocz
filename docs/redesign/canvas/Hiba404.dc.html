body{margin:0;background:#F2F4F8}
a{color:#242a5f}a:hover{color:#1a1f47}

.btn{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s cubic-bezier(.2,.8,.2,1),background-color .25s,color .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -14px rgba(36,42,95,.55)}
.btn:active{transform:translateY(0) scale(.97);transition-duration:.12s}
.btn .arr{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.btn:hover .arr{transform:translateX(4px)}
.lnk{text-decoration:none;background-image:linear-gradient(currentColor,currentColor);background-size:0 2px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .4s cubic-bezier(.2,.8,.2,1),color .25s}

.card{transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s cubic-bezier(.2,.8,.2,1),background-color .3s,color .3s}
.card:hover{transform:translateY(-5px);box-shadow:0 26px 50px -28px rgba(36,42,95,.45)}
.card:active{transform:translateY(-1px) scale(.985)}
.card .go{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.card:hover .go{transform:rotate(-45deg)}
.zoom{overflow:hidden}.zoom img{transition:transform .9s cubic-bezier(.2,.8,.2,1)}.zoom:hover img{transform:scale(1.05)}
.chip{transition:background-color .3s,color .3s,border-color .3s,transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}

.seg-ind,.ind{transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.tabbtn{transition:color .35s}
.tabbtn:hover{color:#242a5f}
.acc{display:grid;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1),opacity .4s ease}
.acc>div{overflow:hidden;min-height:0}
.fade{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.track{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.navlink{position:relative;text-decoration:none;color:#4b5563;font-size:14px;font-weight:600;height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;transition:background-color .3s,color .3s}
.navlink:hover{background:#E6EDE8;color:#242a5f}

.head{transition:background-color .3s}
.head:hover{background:rgba(255,255,255,.35)}
.plus{transition:transform .5s cubic-bezier(.2,.8,.2,1),background-color .3s,color .3s}
.mrow{transition:background-color .25s}
.mrow:hover{background:rgba(255,255,255,.6)}
.box{transition:box-shadow .4s cubic-bezier(.2,.8,.2,1)}
.float{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.spin{animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.qk{color:#ffffff;transition:background-color .3s,color .3s,border-color .3s,transform .3s cubic-bezier(.2,.8,.2,1)}
.qk:hover{background-color:#ffffff;color:#242a5f;border-color:#ffffff;transform:translateY(-2px)}
.qk:active{transform:scale(.97)}
