      topBtn: 'pointer-events: ' + (s.top ? 'auto' : 'none') + '; height: 52px; padding: 0 18px; border: 0; border-radius: 999px; background: rgba(255,255,255,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: #242a5f; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; white-space: nowrap; box-shadow: 0 18px 36px -18px rgba(36,42,95,.55); transition: opacity .4s ' + SPRING + ', transform .5s ' + SPRING + ', max-width .5s ' + SPRING + ', padding .5s ' + SPRING + '; overflow: hidden; opacity: ' + (s.top ? '1' : '0') + '; transform: translateY(' + (s.top ? '0' : '16px') + ') scale(' + (s.top ? '1' : '.9') + '); max-width: ' + (s.top ? '200px' : '0px') + (s.top ? '' : '; padding: 0'),
      toc: tocItems.map((t, i) => { const on = i === curIdx; return { num: t.num, x: t.x, current: on ? 'true' : 'false',
        go: (e) => { const sc = mainOf(e); this.setState({ toc: false }); if (!sc) return; const el = sc.querySelector('#' + t.id); if (el) sc.scrollTo({ top: el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 136, behavior: 'smooth' }); },
        style: 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 14px 8px 8px; border: 0; border-radius: 999px; text-align: left; color: #242a5f; transition: background-color .3s; background: ' + (on ? '#E6EDE8' : 'transparent'),
        numStyle: 'flex-shrink: 0; min-width: 38px; height: 38px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; ' + (on ? 'background: #242a5f; color: #ffffff' : 'background: #F2F4F8; color: #2f7a75') }; }),
      backdropStyle: 'position: absolute; inset: 0; z-index: 60; background: rgba(20,24,56,.48); transition: opacity .45s ' + SPRING + '; opacity: ' + (tocOpen ? '1' : '0') + '; pointer-events: ' + (tocOpen ? 'auto' : 'none'),
      sheetStyle: 'position: absolute; left: 0; right: 0; bottom: 0; z-index: 70; max-height: 78%; display: flex; flex-direction: column; background: #ffffff; border-radius: 32px 32px 0 0; box-shadow: 0 -20px 50px -20px rgba(20,24,56,.45); transform: translateY(' + (tocOpen ? '0' : '104%') + '); transition: transform ' + (tocOpen ? '.6s ' + SPRING : '.45s ' + EASE) + ', visibility 0s linear ' + (tocOpen ? '0s' : '.45s') + '; visibility: ' + (tocOpen ? 'visible' : 'hidden')
    };
  }
}
</script>
