<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Mobil fejléc és menü (komponens)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="font-family: 'Plus Jakarta Sans', sans-serif; color: #242a5f; position: sticky; top: 0; z-index: 40">
<!-- App bar -->
<div style="{{barStyle}}">
<a href="MobilFooldal.dc.html" style="{{fadeStyle}}; display: flex; align-items: center; margin-right: auto"><img src="/_blob/1c6938e4b2f9b3222fad4a4c6e449ae1" alt="Mórocz Medical – kezdőlap" style="height: 30px; width: auto"></a>
<a href="tel:+36706395239" aria-label="Hívás: +36 70 639 5239" style="{{fadeStyle}}; width: 44px; height: 44px; border-radius: 999px; background: #ffffff; color: #242a5f; display: inline-flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></a>
<button type="button" onClick="{{toggle}}" aria-expanded="{{open}}" aria-controls="mobil-menu" aria-label="{{btnLabel}}" style="{{btnStyle}}">
<span aria-hidden="true" style="{{bar1}}"></span>
<span aria-hidden="true" style="{{bar2}}"></span>
</button>
</div>

<!-- Full-screen menu: circular reveal from the menu button -->
<div id="mobil-menu" aria-hidden="{{hidden}}" style="{{overlayStyle}}">
<div style="height: 100%; overflow-y: auto; padding: 92px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<nav aria-label="Mobil navigáció">
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<li style="{{it.liStyle}}">
<sc-if value="{{it.isGroup}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{toggleSub}}" aria-expanded="{{subOpen}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 4px; border: 0; background: transparent; color: #ffffff; text-align: left; cursor: pointer; font-family: inherit">
<span style="font-size: 13px; font-weight: 700; color: #a3dac2; width: 24px; font-variant-numeric: tabular-nums">{{it.num}}</span>
<span style="flex: 1; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">{{it.label}}</span>
<span style="{{subIcon}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
</button>
<div style="{{subWrap}}"><div style="overflow: hidden; min-height: 0"><div style="display: flex; flex-direction: column; gap: 6px; padding: 0 0 14px 38px">
<sc-for list="{{subs}}" as="sb" hint-placeholder-count="5">
<a href="{{sb.href}}" style="display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,.08); color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 700">{{sb.label}}<span style="font-size: 13px; font-weight: 600; color: #a3dac2">{{sb.meta}}</span></a>
</sc-for>
</div></div></div>
</sc-if>
<sc-if value="{{it.isLink}}" hint-placeholder-val="{{true}}">
<a href="{{it.href}}" aria-current="{{it.current}}" style="display: flex; align-items: center; gap: 14px; padding: 16px 4px; color: #ffffff; text-decoration: none">
<span style="font-size: 13px; font-weight: 700; color: #a3dac2; width: 24px; font-variant-numeric: tabular-nums">{{it.num}}</span>
<span style="{{it.labelStyle}}">{{it.label}}<sc-if value="{{it.lotus}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="position: absolute; right: -2px; top: -6px; width: 24px; height: 24px; transform: rotate(45deg)"><path d="M12 3c1.9 2.2 2.9 4.6 2.9 7.2 0 2.2-1 4.2-2.9 5.8-1.9-1.6-2.9-3.6-2.9-5.8C9.1 7.6 10.1 5.2 12 3z"></path><path d="M5 8.5c2.6.2 4.7 1.3 6 3.2.7 1.1.9 2.4.6 3.7-2.7.1-4.9-.9-6.3-2.8C4.5 11.2 4.4 10 5 8.5z" opacity=".85"></path><path d="M19 8.5c-2.6.2-4.7 1.3-6 3.2-.7 1.1-.9 2.4-.6 3.7 2.7.1 4.9-.9 6.3-2.8.8-1.4.9-2.6.3-4.1z" opacity=".85"></path><path d="M2.5 13.5c2.4-.2 4.6.5 6.2 2 .9.9 1.4 2 1.5 3.2-2.6.5-4.9-.1-6.5-1.7-.9-.9-1.3-2-1.2-3.5z" opacity=".7"></path><path d="M21.5 13.5c-2.4-.2-4.6.5-6.2 2-.9.9-1.4 2-1.5 3.2 2.6.5 4.9-.1 6.5-1.7.9-.9 1.3-2 1.2-3.5z" opacity=".7"></path></svg></sc-if></span>
<span style="width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,.1); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
</sc-if>
</li>
</sc-for>
</ul>
</nav>

<div style="{{quickStyle}}">
<a href="tel:+36706395239" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 76px; border-radius: 28px; background: rgba(255,255,255,.08); color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3dac2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Hívás</a>
<a href="mailto:recepcio@drmoroczangela.hu" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 76px; border-radius: 28px; background: rgba(255,255,255,.08); color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3dac2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM22 6l-10 7L2 6"></path></svg>E-mail</a>
<a href="https://maps.google.com/?q=Esztergom+Martsa+Alajos+utca+6/c" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 76px; border-radius: 28px; background: rgba(255,255,255,.08); color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3dac2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>Útvonal</a>
</div>

<div style="{{hoursStyle}}">
<span style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #a3dac2"><span>Rendelési idő</span><sc-if value="{{seasonName}}" hint-placeholder-val="{{false}}"><span style="letter-spacing: 0; text-transform: none; color: #242a5f; background: #a3dac2; border-radius: 999px; padding: 4px 12px">{{seasonName}}</span></sc-if></span>
<sc-for list="{{week}}" as="w" hint-placeholder-count="3">
<span style="display: flex; justify-content: space-between; font-size: 15px; color: #ffffff"><span style="color: #c9cde3">{{w.name}}</span><strong style="font-variant-numeric: tabular-nums">{{w.hours}}</strong></span>
</sc-for>
</div>

<a href="MobilFoglalas.dc.html" style="{{ctaStyle}}">Időpontfoglalás <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["","fooldal","szolgaltatasok","joga","blog","kapcsolat"],"default":""},"startOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: !!props.startOpen, sub: false }; }
  renderVals() {
    const s = this.state;
    const o = s.open;
    const active = this.props.active || '';
    const EASE = 'cubic-bezier(.77,0,.18,1)';
    const SPRING = 'cubic-bezier(.2,.8,.2,1)';
    // Sanity snapshot: seasonalSchedule overrides weeklySchedule (same data as the homepage)
    const WEEKLY = [ { d: 1, s: '12:00', e: '15:20' }, { d: 2, s: '12:00', e: '15:20' }, { d: 4, s: '13:00', e: '16:40' } ];
    const SEASONAL = [ { name: 'November', from: '2026-11-01', to: '2026-12-31', days: [ { d: 2, s: '13:20', e: '16:40' }, { d: 3, s: '11:00', e: '14:20' }, { d: 4, s: '13:20', e: '16:40' } ] } ];
    const DAYN = ['Vasárnap','Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat'];
    const t = new Date(); const p2 = (n) => (n < 10 ? '0' : '') + n;
    const iso = t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-' + p2(t.getDate());
    const season = SEASONAL.find((x) => x.from <= iso && iso <= x.to);
    const days = season ? season.days : WEEKLY;
    const ITEMS = [
      { key: 'fooldal', label: 'Kezdőlap', href: 'MobilFooldal.dc.html' },
      { key: 'szolgaltatasok', label: 'Szolgáltatások', group: true },
      { key: 'joga', label: 'Lélekző Jóga', href: 'MobilJoga.dc.html', lotus: true },
      { key: 'blog', label: 'Blog', href: 'BlogCikk.dc.html' },
      { key: 'kapcsolat', label: 'Kapcsolat', href: 'MobilKapcsolat.dc.html' }
    ];
    const reveal = (i) => 'opacity: ' + (o ? '1' : '0') + '; transform: translateY(' + (o ? '0' : '28px') + '); transition: opacity .5s ' + SPRING + ' ' + (o ? (180 + i * 60) : 0) + 'ms, transform .6s ' + SPRING + ' ' + (o ? (180 + i * 60) : 0) + 'ms';
    return {
      open: o, hidden: o ? 'false' : 'true',
      barStyle: 'position: relative; z-index: 60; height: 68px; padding: 0 12px 0 16px; display: flex; align-items: center; gap: 8px; transition: background-color .4s; background: ' + (o ? 'transparent' : 'rgba(242,244,248,.86)') + '; backdrop-filter: ' + (o ? 'none' : 'blur(16px)') + '; -webkit-backdrop-filter: ' + (o ? 'none' : 'blur(16px)'),
      fadeStyle: 'transition: opacity .35s, transform .45s ' + SPRING + '; opacity: ' + (o ? '0' : '1') + '; transform: translateY(' + (o ? '-8px' : '0') + '); pointer-events: ' + (o ? 'none' : 'auto'),
      btnLabel: o ? 'Menü bezárása' : 'Menü megnyitása',
      toggle: () => this.setState({ open: !o, sub: false }),
      btnStyle: 'position: relative; z-index: 60; width: 52px; height: 52px; border-radius: 999px; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background-color .45s ' + EASE + ', transform .3s ' + SPRING + '; background: ' + (o ? '#e1bbcd' : '#242a5f'),
      bar1: 'position: absolute; width: 20px; height: 2.5px; border-radius: 999px; transition: transform .5s ' + EASE + ', background-color .45s; background: ' + (o ? '#242a5f' : '#ffffff') + '; transform: ' + (o ? 'translateY(0) rotate(45deg)' : 'translateY(-4px)'),
      bar2: 'position: absolute; width: 20px; height: 2.5px; border-radius: 999px; transition: transform .5s ' + EASE + ', background-color .45s; background: ' + (o ? '#242a5f' : '#ffffff') + '; transform: ' + (o ? 'translateY(0) rotate(-45deg)' : 'translateY(4px) scaleX(.7)'),
      overlayStyle: 'position: fixed; inset: 0; z-index: 50; background: #242a5f; color: #ffffff; clip-path: circle(' + (o ? '160%' : '0px') + ' at calc(100% - 38px) 34px); -webkit-clip-path: circle(' + (o ? '160%' : '0px') + ' at calc(100% - 38px) 34px); transition: clip-path .75s ' + EASE + ', -webkit-clip-path .75s ' + EASE + '; pointer-events: ' + (o ? 'auto' : 'none') + '; visibility: ' + (o ? 'visible' : 'hidden') + '; transition-property: clip-path, -webkit-clip-path, visibility; transition-delay: 0s, 0s, ' + (o ? '0s' : '.75s'),
      items: ITEMS.map((it, i) => { const on = it.key === active; return { ...it, num: p2(i + 1), isGroup: !!it.group, isLink: !it.group, lotus: !!it.lotus, current: on ? 'page' : 'false',
        liStyle: 'border-bottom: 1px solid rgba(255,255,255,.1); ' + reveal(i),
        labelStyle: 'position: relative; flex: 1; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; padding-right: ' + (it.lotus ? '30px' : '0') + '; color: ' + (it.lotus ? '#76c8b6' : (on ? '#a3dac2' : '#ffffff')) }; }),
      subOpen: s.sub,
      toggleSub: () => this.setState({ sub: !s.sub }),
      subIcon: 'width: 40px; height: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .45s ' + SPRING + ', background-color .3s; background: ' + (s.sub ? '#a3dac2' : 'rgba(255,255,255,.1)') + '; color: ' + (s.sub ? '#242a5f' : '#ffffff') + '; transform: rotate(' + (s.sub ? '180deg' : '0deg') + ')',
      subWrap: 'display: grid; grid-template-rows: ' + (s.sub ? '1fr' : '0fr') + '; opacity: ' + (s.sub ? '1' : '0') + '; transition: grid-template-rows .5s ' + SPRING + ', opacity .4s',
      subs: [
        { label: 'Nőgyógyászat', href: 'MobilSzolgaltatas.dc.html', meta: '30 000 Ft-tól' },
        { label: 'Várandósgondozás', href: 'Varandosgondozas.dc.html', meta: '45 000 Ft' },
        { label: 'Szülészet', href: 'Szuleszet.dc.html', meta: '' },
        { label: 'Gyógyszerfelírás', href: 'Gyogyszerfeliras.dc.html', meta: '4 900 Ft' },
        { label: 'Teljes árlista', href: 'MobilArak.dc.html', meta: '' }
      ],
      quickStyle: 'display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; ' + reveal(ITEMS.length),
      hoursStyle: 'display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border-radius: 28px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); ' + reveal(ITEMS.length + 1),
      seasonName: season ? season.name : '',
      week: days.map((d) => ({ name: DAYN[d.d], hours: d.s + ' – ' + d.e })),
      ctaStyle: 'margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; border-radius: 999px; background: #e1bbcd; color: #242a5f; text-decoration: none; font-size: 17px; font-weight: 800; ' + reveal(ITEMS.length + 2)
    };
  }
}
</script>
</body>
</html>
